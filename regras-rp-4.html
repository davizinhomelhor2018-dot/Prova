@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1519;--surf:#182229;--tx:#e8eef2;--mu:#9bacb8;--bd:#2b3a44;--ac:#5cc4e0;--pen:#3a1d1f;--pent:#ffb3b3;--hl:#7a6500}}
:root[data-theme="dark"]{--bg:#0f1519;--surf:#182229;--tx:#e8eef2;--mu:#9bacb8;--bd:#2b3a44;--ac:#5cc4e0;--pen:#3a1d1f;--pent:#ffb3b3;--hl:#7a6500}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--bd);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:1.1rem;margin:0 0 8px}
.row{display:flex;gap:8px}
input{flex:1;font:inherit;padding:12px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--surf);color:var(--tx)}
input:focus{outline:none;border-color:var(--ac)}
button{font:inherit;padding:0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--surf);color:var(--tx);cursor:pointer}
.info{font-size:.85rem;color:var(--mu);margin-top:6px}
main{max-width:820px;margin:0 auto;padding:14px 16px 40px;display:grid;gap:12px}
article{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
article.sub{margin-left:18px;border-left:4px solid var(--ac)}
h2{font-size:1.05rem;margin:0 0 6px;color:var(--ac)}
h2 small{color:var(--mu);font-weight:400;font-size:.85rem}
p{margin:6px 0}
.pen{background:var(--pen);color:var(--pent);padding:8px 10px;border-radius:8px;margin-top:8px;font-size:.95rem}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.none{text-align:center;color:var(--mu);padding:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:20px;font-size:.9rem}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
h3{font-size:1rem;margin:8px 0 0}
.note{font-size:.9rem;color:var(--mu);margin:0}
.zoom{margin-left:auto;padding:6px 12px;border-radius:20px;font-size:.9rem}
ul{margin:6px 0;padding-left:20px}
li{margin:3px 0}
</style>
</head>

function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function hl(t,terms){
  if(!terms.length)return esc(t);
  var nt=norm(t),mask=new Array(t.length).fill(false);
  terms.forEach(function(w){var i=0;while((i=nt.indexOf(w,i))>-1){for(var k=i;k<i+w.length;k++)mask[k]=true;i+=w.length}});
  var o="",open=false;
  for(var i=0;i<t.length;i++){
    if(mask[i]&&!open){o+="<mark>";open=true}
    if(!mask[i]&&open){o+="</mark>";open=false}
    o+=esc(t[i]);
  }
  return o+(open?"</mark>":"");
}

function lev(a,b){var m=a.length,k=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=1;j<=k;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=k;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][k]}
function hit(t,all,words){
  if(all.indexOf(t)>-1)return true;
  if(t.length<4)return false;
  var tol=t.length>=7?2:1;
  for(var i=0;i<words.length;i++){var w=words[i];if(Math.abs(w.length-t.length)<=tol+2&&(lev(t,w)<=tol||lev(t,w.slice(0,t.length))<=tol))return true}
  return false;
}
